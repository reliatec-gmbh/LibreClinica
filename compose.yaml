services:
  libreclinica:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    environment:
      # Set to "jmesa" to force the legacy JMesa rendering path for any table
      # that has been migrated to HtmlFlow. Unset (or any other value) uses HtmlFlow.
      TZ: ${TZ:-UTC}
      LC_TABLE_RENDERING: ${LC_TABLE_RENDERING:-htmlflow}

    develop:
      watch:
        # restart on config file changes
        - action: sync+restart
          path: ./docker/config
          target: /usr/local/tomcat/libreclinica.config

        # rebuild on source file changes
        - action: rebuild
          path: ./core

        - action: rebuild
          path: ./odm

        - action: rebuild
          path: ./web

        - action: rebuild
          path: ./ws

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_PASSWORD: clinica
      POSTGRES_USER: clinica
      POSTGRES_DB: libreclinica

  smtp:
    image: docker.io/marlonb/mailcrab:v1.1.0
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:1080:1080"
