services:
  libreclinica:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - libreclinica-data:/usr/local/tomcat/libreclinica.data
      - libreclinica-logs:/usr/local/tomcat/logs
    depends_on:
      - db
    develop:
      watch:
        # restart on config file changes
        - action: sync+restart
          path: ./docker/config
          target: /usr/local/tomcat/libreclinica.config

        # rebuild on source file changes
        - action: rebuild
          path: ./core

        - action: rebuild
          path: ./odm

        - action: rebuild
          path: ./web

        - action: rebuild
          path: ./ws

  db:
    image: docker.io/library/postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: clinica
      POSTGRES_USER: clinica
      POSTGRES_DB: libreclinica
    volumes:
      - db-data:/var/lib/postgresql/data

  smtp:
    image: docker.io/marlonb/mailcrab:v1.1.0
    ports:
      - "127.0.0.1:1080:1080"

# Named volumes keep the database, uploaded files and logs across
# `docker compose down` / `up`. Note that `docker compose down -v`
# removes them permanently.
volumes:
  db-data:
  libreclinica-data:
  libreclinica-logs:
