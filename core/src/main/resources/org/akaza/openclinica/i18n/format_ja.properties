#########################################
# date_format
#########################################
# The 'date_format' property is used in the text of date field,
# to instruct the user which format the application is using.
# Years may not be 2 digits in the application.
#########################################

date_format=DD-MMM-YYYY

date_format_calender=%d-%b-%Y

#########################################
# date_format_string
#########################################
# The 'date_format_string' property is used to generate dates
# in the system, and is used by the application side only.
# Years may not be 2 digits in the application.
#########################################
date_format_string=dd-MMM-yyyy

date_format_string_ds=yyyy-MM-dd

#date_time_format_string = MM/dd/yyyy hh:mm:ss a
#########################################
# date_format_year
#########################################
# The 'date_format_year' property is used in the text of a year field,
# to instruct the user which format years should be submitted.
# Years may not be 2 digits in the application.
#########################################
date_format_year=YYYY

#########################################
# The 'date_format_year' property is used in the text of a year-month field,
# to instruct the user which format year-month should be submitted.
# Years may not be 2 digits in the application.
#########################################
date_format_year_month=MMM-yyyy

#########################################
# date_regexp
#########################################
# The 'date_regexp' property is the regular expression used to
# check against date fields entered by the user.  This is used on the
# application side only.
# Years may not be 2 digits in the application.
#########################################
date_regexp=[0-9]{4}[\\-\\.][A-Za-z]{3}[\\-\\.][0-9]{1,2}

#########################################
# date_time_format
#########################################
# The 'date_time_format' property is used in the text of a date/time
# field, to instruct the user which format to submit date/time fields.
# Years may not be 2 digits in the application.
#########################################
#date_time_format = MM/DD/YYYY HH:MM a
date_time_format=DD-MMM-YYYY HH:MM

#########################################
# date_time_format_string
#########################################
# The 'date_time_format_string' property is used to generate date/time
# fields in the system, and is used on the application side only.
# Years may not be 2 digits in the application.
#########################################
date_time_format_string=dd-MMM-yyyy HH:mm:ss

#########################################
# date_time_regexp
#########################################
# The 'date_time_regexp' property is the regular expression used to
# check against date/time fields entered by the user. This is used on the
# application side only.
# Years may not be 2 digits in the application.
#########################################
#date_time_regexp = [0-9]{1,2}/[0-9]{1,2}/[0-9]{4} [0-9]{1,2}:[0-9]{1,2} [aApP][mM]
date_time_regexp=[0-9]{1,2}/[a-zA-Z]{3}/[0-9]{4} [0-9]{1,2}:[0-9]{1,2}

#########################################
# image_dir
########################################
# The 'image_dir' points to the location of all the images in the local
# language of the site.  Note that this is a physical location within
# the web server, and should not be changed, unless you have created
# a new directory with all the language-specific files inside.
########################################
image_dir=en

jscalendar_language_file=calendar-ja.js

mid_date_format=MM/dd

########################################
# nullValue
########################################
# The 'nullValue' property points to a language-specific page which contains
# information about definitions of null values in the system.  Also note,
# this is a physical location and should not be changed unless you have
# created a new page on the server with this information.
########################################
nullValue=nullValue.htm

########################################
# The following strings are used to standardize date strings for CRFs
# and for data submitted, and should not be changed.
########################################
oc_date_format_string=MM/dd/yyyy

#########################################
# phone_format
#########################################
# The 'phone_format' is a string used in validating the next regular
# expression, and also used in text to tell the user how to enter phone numbers
# in the user interface.
# Years may not be 2 digits in the application.
#########################################
phone_format=0X0-XXXX-XXXX

#########################################
# phone_regexp
#########################################
# The 'phone_regexp' property is the regular expression for check against phone
# numbers entered by the user.
#########################################
phone_regexp=[0-9]{2,4}[\\-\\.][0-9]{2,4}[\\-\\.][0-9]{3,4}
